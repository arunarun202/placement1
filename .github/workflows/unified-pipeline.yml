name: Unified Deploy & E2E Testing Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy_web:
    name: Build & Deploy React App to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build
          # Crucial for React Router SPA on GitHub Pages
          cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  test_web_selenium:
    name: Run Web Selenium E2E Tests
    needs: build_and_deploy_web
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ needs.build_and_deploy_web.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages Deployment to go live
        run: sleep 30
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Test dependencies
        run: |
          cd tests
          npm install
      - name: Run Web Selenium Tests
        run: |
          cd tests
          npm test
        continue-on-error: true
      - name: Upload Web Selenium Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-selenium-report
          path: tests/Test_Results_Summary.xlsx

  test_mobile_e2e:
    name: Run Mobile E2E Tests (WDIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Mobile Dependencies & Build APK
        run: |
          cd mobile
          npm install
          npm run build
          npm install @capacitor/android
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Mobile WDIO Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          script: |
            cd mobile/e2e-tests
            npm install
            # Run the WDIO test suite (will start appium internally based on wdio.conf.js)
            npm run wdio || true
        continue-on-error: true
      - name: Upload Mobile Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-e2e-report
          path: mobile/e2e-tests/Test-Report.xlsx

  test_backend_dast:
    name: Run Backend DAST Security Scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: placement_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://myuser:mypassword@localhost:5432/placement_db
      SECRET_KEY: testsecret
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install openpyxl pytest httpx psycopg2-binary
      - name: Apply schema
        run: |
          cd backend
          PGPASSWORD=mypassword psql -h localhost -U myuser -d placement_db -f schema.sql
      - name: Run DAST Scan
        run: |
          cd backend
          python automated_test/generate_excel_report.py || true
      - name: Upload DAST Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-dast-report
          path: backend/automated_test/DAST_Security_Report_v2.xlsx

  test_source_security:
    name: Run Source Security Scans (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks Security Scan
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          ./gitleaks detect --source . -v || true

  consolidate_reports:
    name: Consolidate & Verify Reports
    needs: [test_web_selenium, test_mobile_e2e, test_backend_dast, test_source_security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare Reports Directory
        run: |
          RUN_DIR="public_reports/test_reports/test#${{ github.run_number }}"
          mkdir -p "$RUN_DIR"
          
          # Move Excel Reports
          cp artifacts/web-selenium-report/*.xlsx "$RUN_DIR/" 2>/dev/null || true
          cp artifacts/mobile-e2e-report/*.xlsx "$RUN_DIR/" 2>/dev/null || true
          cp artifacts/backend-dast-report/*.xlsx "$RUN_DIR/" 2>/dev/null || true
          
          # Rename them for clarity
          mv "$RUN_DIR/Test_Results_Summary.xlsx" "$RUN_DIR/Web_E2E_Test_Report.xlsx" 2>/dev/null || true
          mv "$RUN_DIR/Test-Report.xlsx" "$RUN_DIR/Mobile_E2E_Test_Report.xlsx" 2>/dev/null || true

      - name: Generate GitHub Actions Markdown Dashboard
        run: |
          cat << 'MARKDOWN_EOF' >> $GITHUB_STEP_SUMMARY
          # 🧪 Placement Predictor Unified Test Dashboard
          
          This dashboard presents a unified summary of E2E tests, security scans, and API testing across all major components: Website, Mobile App, Backend, and APIs.
          
          ## 📊 Unified Summary Overview
          
          | Component | Test Suite / Report | Format |
          | :--- | :--- | :---: |
          | **Website E2E** | Mocha / Selenium Web Automation | 📊 Excel |
          | **Mobile E2E** | WebdriverIO Mobile App Automation | 📊 Excel |
          | **Backend DAST** | API Security & Integrity Scan | 📊 Excel |
          | **Source Security** | Gitleaks Vulnerability Scan | Terminal Output |
          
          ## 📦 Test Report Artifacts
          
          The Excel test report files are uploaded as part of this workflow run and can be downloaded from the artifacts list below, or accessed directly via GitHub Pages:
          
          - **Website E2E Excel Report:** `test_reports/test#${{ github.run_number }}/Web_E2E_Test_Report.xlsx`
          - **Mobile E2E Excel Report:** `test_reports/test#${{ github.run_number }}/Mobile_E2E_Test_Report.xlsx`
          - **Backend DAST Excel Report:** `test_reports/test#${{ github.run_number }}/DAST_Security_Report_v2.xlsx`
          MARKDOWN_EOF

      - name: Deploy Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_reports
          keep_files: true
          target_branch: gh-pages
